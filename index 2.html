<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100b23"><title>The Pickle Calendar</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f0ff;background:#100b23}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#47206b 0%,transparent 42%),radial-gradient(ellipse at 90% 65%,#192d62 0%,transparent 50%),#100b23;min-height:100vh}main{max-width:750px;margin:auto;padding:20px 13px 80px}header{text-align:center;padding:12px 0 20px}h1{font-size:29px;margin:0}small,.muted{color:#c4b6d9}.subtitle{font-size:12px;margin-top:6px}.tabs,.toolbar,.weeknav{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0}.tabs button,.toolbar button,.weeknav button,button{background:#302448;color:white;border:1px solid #655184;border-radius:12px;padding:10px 13px;font-weight:600;cursor:pointer}.tabs button.active,.toolbar button.active{background:#a37bd7;color:#170b2a}.weeknav strong{min-width:165px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.day{background:#211932d9;border:1px solid #5e4c7a;border-radius:15px;padding:10px;min-height:146px}.day:last-child{grid-column:1/-1;min-height:100px}.day h3{font-size:13px;margin:0 0 8px;color:#e3c6ff}.event{font-size:10px;line-height:1.35;background:#68468e;border-radius:6px;padding:5px 6px;margin-bottom:5px;overflow-wrap:anywhere}.event.maxim{background:#235b79}.event.shared{background:#365c52}.checkitem{display:flex;align-items:flex-start;gap:6px;font-size:12px;margin:7px 0}.checkitem input{accent-color:#b992f1;margin:2px 0}.checkitem.done span{text-decoration:line-through;opacity:.6}.add{width:100%;margin-top:8px;border:1px dashed #796395;background:transparent;color:#d8c0f9;font-size:12px;padding:7px}.primary{background:#a37bd7;color:#180b27;border:0}.notice{font-size:12px;text-align:center;color:#c5b8d8;margin-top:16px}dialog{border:1px solid #786399;border-radius:18px;background:#231935;color:white;padding:22px;width:min(92vw,400px)}dialog::backdrop{background:#000a}dialog input,dialog select{display:block;width:100%;margin:8px 0 15px;background:#130e20;border:1px solid #786399;color:white;border-radius:9px;padding:12px;font-size:16px}dialog label{font-size:13px;color:#d8c9e9}.actions{display:flex;justify-content:flex-end;gap:8px} body:has(.calendar.month) main{max-width:850px;padding-left:6px;padding-right:6px}.calendar.month{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.calendar.month .day{min-height:105px;border-radius:7px;padding:4px 2px;min-width:0;overflow:hidden}.calendar.month .day:last-child{grid-column:auto;min-height:105px}.calendar.month .day h3{font-size:10px;margin:0 0 4px;text-align:center;white-space:nowrap}.calendar.month .event{font-size:8px;line-height:1.2;padding:3px 2px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px}.calendar.month .add{font-size:9px;padding:3px 0;margin-top:4px;border-radius:5px}.calendar.month .outside{opacity:.35}.calendar.month .today{border-color:#d6a3ff;box-shadow:inset 0 0 0 1px #b68af0}.weekday-head{font-size:10px;text-align:center;color:#d9c4f0;font-weight:700;padding:4px 0}.calendar.month .day h3{font-size:11px}.star{position:fixed;pointer-events:none;color:#fff7;z-index:-1}
</style></head><body><main><header><h1>🥒 The Pickle Calendar</h1><div class="subtitle">Our little corner of the universe ✨</div></header><div class="tabs"><button id="calendarTab" class="active">📅 Calendar</button><button id="tasksTab">☑ Weekly To-Dos</button></div><div class="toolbar"><button data-filter="all" class="active">Everyone</button><button data-filter="natalie">💜 Natalie</button><button data-filter="maxim">💙 Maxim</button></div><div class="weeknav"><button id="prev">‹</button><strong id="weekLabel"></strong><button id="next">›</button></div><section id="days" class="calendar"></section><p class="notice">Preview mode: changes are saved on this device only. Shared accounts come next.</p></main><dialog id="editor"><form id="editForm"><h2 id="dialogTitle">Add</h2><label>Title<input name="title" maxlength="160" required placeholder="What's happening?"></label><label>For<select name="owner"><option value="shared">💚 Shared</option><option value="natalie">💜 Natalie</option><option value="maxim">💙 Maxim</option></select></label><label id="timeLabel">Time<input type="time" name="time"></label><div class="actions"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog><script>
const $=s=>document.querySelector(s),key='pickle-calendar-preview-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||[]}catch{data=[]}let view='calendar',filter='all',offset=0,taskOffset=0,selectedDate='';const weekdays=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function start(){let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+taskOffset*7);d.setHours(12,0,0,0);return d}function save(){localStorage.setItem(key,JSON.stringify(data))}function render(){const container=$('#days');container.replaceChildren();container.className='calendar'+(view==='calendar'?' month':'');let dates=[];if(view==='calendar'){const today=new Date(),first=new Date(today.getFullYear(),today.getMonth()+offset,1,12),month=first.getMonth(),year=first.getFullYear();$('#weekLabel').textContent=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});const mondayOffset=(first.getDay()+6)%7;const gridStart=new Date(year,month,1-mondayOffset,12);const count=Math.ceil((mondayOffset+new Date(year,month+1,0).getDate())/7)*7;for(const label of ['M','T','W','T','F','S','S']){const h=document.createElement('div');h.className='weekday-head';h.textContent=label;container.append(h)}for(let i=0;i<count;i++){let d=new Date(gridStart);d.setDate(d.getDate()+i);dates.push({d,outside:d.getMonth()!==month})}}else{const first=start(),last=new Date(first);last.setDate(last.getDate()+6);$('#weekLabel').textContent=`${first.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${last.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;for(let i=0;i<7;i++){const d=new Date(first);d.setDate(d.getDate()+i);dates.push({d,outside:false})}}for(const {d,outside} of dates){const iso=localISO(d),box=document.createElement('article');box.className='day'+(outside?' outside':'')+(iso===localISO(new Date())?' today':'');const h=document.createElement('h3');h.textContent=view==='calendar'?String(d.getDate()):`${weekdays[d.getDay()]} ${d.getDate()}`;box.append(h);data.filter(x=>x.date===iso&&x.type===view&&(filter==='all'||x.owner===filter||x.owner==='shared')).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).forEach(x=>{if(view==='calendar'){const el=document.createElement('div');el.className='event '+x.owner;el.textContent=(x.time?formatTime(x.time)+' ':'')+x.title;el.title=x.title+' (tap to remove)';el.onclick=()=>remove(x.id);box.append(el)}else{const el=document.createElement('label');el.className='checkitem'+(x.done?' done':'');const input=document.createElement('input');input.type='checkbox';input.checked=!!x.done;input.onchange=()=>{x.done=input.checked;save();render()};const span=document.createElement('span');span.textContent=x.title;span.title='Double tap to remove';span.ondblclick=()=>remove(x.id);el.append(input,span);box.append(el)}});const add=document.createElement('button');add.className='add';add.textContent=view==='calendar'?'+':'+ Task';add.setAttribute('aria-label','Add '+(view==='calendar'?'event':'task')+' on '+iso);add.onclick=()=>openEditor(iso);box.append(add);container.append(box)}}function formatTime(t){let [h,m]=t.split(':').map(Number);return `${h%12||12}${m?' :'+String(m).padStart(2,'0'):''}${h>=12?'p':'a'}`.replace(' :',':')}function remove(id){if(confirm('Remove this item?')){data=data.filter(x=>x.id!==id);save();render()}}function openEditor(date){selectedDate=date;$('#editForm').reset();$('#dialogTitle').textContent=view==='calendar'?'Add event':'Add task';$('#timeLabel').hidden=view!=='calendar';$('#editor').showModal()}$('#editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.push({id:crypto.randomUUID(),date:selectedDate,type:view,title:String(f.get('title')).trim(),owner:f.get('owner'),time:view==='calendar'?f.get('time'):'',done:false});save();$('#editor').close();render()};$('#cancel').onclick=()=>$('#editor').close();$('#prev').onclick=()=>{if(view==='calendar')offset--;else taskOffset--;render()};$('#next').onclick=()=>{if(view==='calendar')offset++;else taskOffset++;render()};for(const name of ['calendar','tasks'])$('#'+name+'Tab').onclick=()=>{view=name;$('.tabs .active').classList.remove('active');$('#'+name+'Tab').classList.add('active');render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelector('.toolbar .active').classList.remove('active');b.classList.add('active');render()});render();
</script></body></html>
